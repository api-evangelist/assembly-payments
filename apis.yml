aid: assembly-payments

name: Assembly Payments

description: Assembly Payments was an Australian payments platform founded to give marketplaces, platforms and businesses embedded payment processing,
  digital wallets, escrow-style payment workflows and real-time payouts through an API. According to the company's own About page, Assembly Payments
  became the first non-bank to launch real-time payments in Australia and later merged with CurrencyFair to become Zai; assemblypay.com now redirects
  to hellozai.com, and the developer portal at developer.hellozai.com (still introduced as 'The Assembly Payments Developer Portal') documents
  the Zai payments API for payment processing, wallets, PayTo, payouts and workflow automation.

