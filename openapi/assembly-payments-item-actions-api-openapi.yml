components:
  schemas:
    account_id_requestBody:
      type: object
      required:
      - account_id
      properties:
        account_id:
          description: Account id of the bank account/credit card, etc making payment (not user id)
          type: string
          example: 725cc8c0-759b-0138-5d6d-0a58a9feac05
          default: 725cc8c0-759b-0138-5d6d-0a58a9feac05
        device_id:
          description: Device Information for the device initiating the payment. This will need to be provided for card payments.
          type: string
          example: ''
        ip_address:
          description: IP Information for the device initiating the payment. This will need to be provided for card payments.
          type: string
          example: ''
        cvv:
          description: CVV / CVC
          type: string
          example: ''
        merchant_phone:
          description: Seller User Phone Number or Mobile number. International number format. Include '+' and no spaces.
          type: string
          example: ''
    single_item:
      type: object
      properties:
        items:
          $ref: '#/components/schemas/item'
    account_id_asyncRequestBody:
      type: object
      required:
      - account_id
      properties:
        account_id:
          description: Account id of the bank account/credit card, etc making payment (not user id)
          type: string
        request_three_d_secure:
          description: 'Customise the 3DS (3D Secure) preference for this payment.

            If `automatic`, 3DS preference is determined automatically by the system.

            If `challenge`, Request a 3DS challenge is presented to the user.

            If `any`, request a 3DS frictionless or challenge flow.

            **Important:** Use the returned `payment_token` to initialise the 3DS2 web component.

            '
          type: string
          example: challenge
          default: automatic
          enum:
          - automatic
          - challenge
          - any
    acknowledge_payment:
      type: object
      properties:
        payment_id:
          type: string
          description: Generated payment ID
          example: '1000014012533486'
        account_id:
          type: string
          description: Card Account ID
          example: 86991380-90a5-013a-57cc-5e50adfe91ad
        payment_token:
          type: string
          description: Token passed to front-end component, for secure access of the payment status
        items:
          $ref: '#/components/schemas/item'
    refund_requestBody:
      type: object
      properties:
        refund_amount:
          description: For partial refunds, if they are enabled for marketplace.
          type: integer
          example: ''
        refund_message:
          description: Reason for the request.
          type: string
          example: ''
        account_id:
          description: The account id to be used to get the refunds from. This will need to be an account that has already been set up within Assembly
          type: string
          example: ''
    item:
      type: object
      required:
      - id
      - name
      - amount
      - payment_type
      - buyer_id
      - seller_id
      properties:
        id:
          type: string
          example: 7190770-1-2908
        name:
          type: string
          example: 'Item #001'
        description:
          type: string
          example: My first Item.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        state:
          type: string
          enum:
          - pending
          - payment_required
          - wire_pending
          - payment_pending
          - payment_held
          - payment_authorized
          - void_pending
          - voided
