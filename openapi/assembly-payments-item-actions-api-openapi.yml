      parameters:
      - name: id
        in: path
        description: Marketplace / Platform item ID
        required: true
        schema:
          type: string
          default: 7190770-1-2908
        example: 7190770-1-2908
      requestBody:
        required: true
        content:
          application/json:
            schema:
