        required: true
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: created_before
        in: query
        description: Date and time in ISO 8601 format the item(s) were created before (e.g. 2020-02-27T23:54:59Z)
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: created_after
