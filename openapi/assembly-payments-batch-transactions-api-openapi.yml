tags:
- name: Batch Transactions
paths:
  /batch_transactions:
    get:
      tags:
      - Batch Transactions
      summary: List Batch Transactions
      description: Retrieve an ordered and paginated list of existing **Batch Transactions**. The list can be filtered by **Account**, **Batch ID**, **Item**, and **Transaction Type**.
      operationId: listBatchTransactions
      parameters:
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      - name: account_id
        in: query
        description: Bank, Card or Wallet Account ID.
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: batch_id
        in: query
        description: Batch ID. This appears on a bank reference.
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: item_id
        in: query
        description: Item ID
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - $ref: '#/components/parameters/transactionType'
      - $ref: '#/components/parameters/transactionTypeMethod'
      - name: direction
        in: query
        description: Direction of the transaction. Options are debit, credit
        style: form
        explode: true
        schema:
          type: string
          enum:
          - debit
          - credit
        example: ''
      - name: created_before
        in: query
        description: Date and time in ISO 8601 format the item(s) were created before (e.g. 2020-02-27T23:54:59Z)
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: created_after
        in: query
        description: Date and time in ISO 8601 format the item(s) were created after (e.g. 2020-02-27T23:54:59Z)
        style: form
        explode: true
        schema:
          type: string
        example: ''
      - name: disbursement_bank
        in: query
        description: The bank used for disbursing the payment. Please use a default value of `any`
        style: form
        explode: true
        schema:
          type: string
        example: any
      - name: processing_bank
        in: query
        description: The bank used for processing the payment. Please use a default value of `any`
        style: form
        explode: true
        schema:
          type: string
        example: any
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
