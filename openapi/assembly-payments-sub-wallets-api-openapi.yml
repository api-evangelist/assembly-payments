          content:
            application/json:
              schema:
                $ref: '#/components/schemas/sub_wallet_error_responseBody'
              examples:
                feature configuration not enabled:
                  value:
                    errors:
                      sub_wallets:
                      - feature not available
                id not provided:
                  value:
                    errors:
                      id:
                      - required field missing
                id format is invalid:
                  value:
                    errors:
                      id:
                      - invalid format
                id is invalid:
                  value:
