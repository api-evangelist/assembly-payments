  /sub_wallets/{id}/users:
    get:
      tags:
      - Sub-wallets
      summary: Show Sub-wallet User
      description: Show the user that a sub-wallet is associated with using the given `:id`.
      operationId: showSubWalletUser
      parameters:
      - name: id
        in: path
