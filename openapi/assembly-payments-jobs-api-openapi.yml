tags:
- name: Jobs
paths:
  /webhooks/{uuid}/jobs:
    get:
      tags:
      - Jobs
      summary: Get jobs associated to Webhook
      description: Retrieve an ordered and paginated list of the jobs garnered from a webhook using a given `:id`.
      parameters:
      - name: uuid
        in: path
        description: ID of webhook
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      - name: status
        in: query
        description: Narrow down records per status
        style: form
        explode: true
        schema:
          type: string
          enum:
          - success
          - failed
          - ''
          default: ''
        example: success
      - name: object_id
        in: query
        description: Narrow down records per object_id
        style: form
        explode: true
        schema:
          type: string
          default: ''
      operationId: getJobs
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jobs'
              examples:
                response:
                  value:
                    jobs:
                    - hashed_payload: '32187'
                      updated_at: '2009-11-11T18:00:00+12:00'
                      created_at: '2021-03-18T05:31:32.867255Z'
                      object_id: buyer-123456
                      payload:
                        accounts:
                          account_type_id: 9100
                          amount: 0
                          created_at: '2019-11-27T00:04:41.675Z'
                          currency_id: 1
                          id: 20849
                          legal_entity_id: 5769
                          links:
                            self: null
                          updated_at: '2019-11-27T00:04:41.675Z'
                          uuid: 6f348690-f2d7-0137-3328-0242ac110003
                      webhook_uuid: 088e4cf1-2508-4bd4-97ab-a78e4e869970
                      uuid: d98133ca-9a2e-4322-9610-62b2faf78476
                      request_responses:
                      - response_code: 500
                        message: ''
                        created_at: '2021-05-24T06:54:32.019211768Z'
                      - response_code: 500
                        message: ''
                        created_at: '2021-05-24T06:54:32.019211768Z'
                      - response_code: 202
                        message: ''
                        created_at: '2021-05-24T07:24:34.156212905Z'
                    links:
                      self: /webhooks/088e4cf1-2508-4bd4-97ab-a78e4e869970/jobs?limit=2
                      webhooks: /webhooks
                    meta:
                      limit: 2
                      offset: 0
                      total: 10
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                response:
                  value:
                    status: Invalid Status
                    message: valid status are success or failed
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                response:
                  value:
                    status: Forbidden
                    message: empty token
        '404':
          description: Webhook not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                response:
                  value:
                    status: Not Found
                    message: resource not found
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
              examples:
                response:
                  value:
                    status: Internal Server Error
                    message: error fetching jobs
      security:
      - bearerAuth: []
  /webhooks/{uuid}/jobs/{jobUUID}:
    get:
      tags:
      - Jobs
      summary: Show job associated to Webhook
      description: Show details of a specific **Job** response using a given `:id`.
      operationId: getJob
      parameters:
      - name: uuid
        in: path
        description: ID of webhook
        required: true
        schema:
          type: string
          format: uuid
      - name: jobUUID
        in: path
        description: ID of Job
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                response:
                  value:
                    hashed_payload: '32187'
                    updated_at: '2009-11-11T18:00:00+12:00'
                    created_at: '2021-03-18T05:31:32.867255Z'
                    object_id: buyer-123456
