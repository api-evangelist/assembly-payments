components:
  schemas:
    callback_response:
      type: object
      properties:
        id:
          type: string
          example: 4476b384-fa48-4473-98ec-8fcdda4a1e84
        url:
          type: string
          example: https://httpbin.org/post
        created_at:
          type: string
          format: date-time
        payload:
          type: object
          properties:
            message:
              type: string
              example: Assembly callback test
        response:
          type: object
          properties:
            error:
              type: string
              example: OK
        response_code:
          type: integer
          example: 200
    callback_deletion:
      properties:
        callbacks:
          type: string
          example: Successfully redacted
    callbacks:
      properties:
        callbacks:
          type: array
          items:
            $ref: '#/components/schemas/callback'
    callback:
      type: object
      properties:
        id:
          type: string
          example: f92d4ca1-4ee5-43f3-9e34-ca5f759c5e76
        description:
          type: string
          example: Users Callback
        url:
          type: string
          example: https://httpbin.org/post
        object_type:
          type: string
          enum:
          - Transactions
          - Items
          - Users
          - Batch Transactions
          - Disbursements
          - Accounts
          example: users
        enabled:
          type: boolean
          example: true
        authorization_token:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        marketplace_id:
          type: string
          format: uuid
        links:
          type: object
          properties:
            self:
              type: string
            responses:
              type: string
    list_callback_responses:
      properties:
        callback_responses:
          type: array
          items:
            $ref: '#/components/schemas/callback_response'
        meta:
          type: object
          properties:
            limit:
              type: integer
            offset:
              type: integer
            total:
              type: integer
        links:
          type: object
          properties:
            self:
              type: string
            callbacks:
              type: string
    single_callback_response:
      properties:
        call_responses:
          $ref: '#/components/schemas/callback_response'
    single_callback:
      properties:
        callbacks:
          $ref: '#/components/schemas/callback'
    callback_requestBody:
      type: object
      required:
      - description
      - url
      - object_type
      - enabled
      properties:
        url:
          description: URL to which the callbacks will notify
          type: string
          default: https://httpbin.org
          example: https://httpbin.org
        object_type:
          description: Object or entity to which the callbacks refer. Please refer to [Callbacks](https://developer.assemblypayments.com/docs/callbacks) for a list of object types.
          type: string
          default: users
          example: users
        enabled:
          description: Toggle whether callback is active or inactive.
          type: string
          default: 'true'
          example: 'true'
  parameters:
    offsetParam:
      name: offset
      in: query
      description: Number of records to offset. Required for pagination.
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    limitParam:
      name: limit
      in: query
      description: Number of records to retrieve. Up to 200.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
  securitySchemes:
    oAuth2ClientCredentials:
      type: oauth2
      description: Please refer to Authentication section within https://developer.assemblypayments.com/reference#authentication
      flows:
        clientCredentials:
          tokenUrl: https://au-0000.sandbox.auth.assemblypay.com/tokens
          scopes: {}
