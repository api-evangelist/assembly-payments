    post:
      tags:
      - Users
      summary: Create User
      description: 'Create a **User** that can be associated with **Items** as either a buyer or a seller. **Users** can''t be both the buyer and seller for the same **Item**. You can also use this endpoint to create a **company** for the user. To create a company for the user, you need to send company parameters in the same request. **Note**: Some parameters are required for user verification. See our guide on Onboarding a Payout User/Seller for more information.'
